# Publishes the built Secvisogram app together with the CSAF trusted-provider
# output of secvisogram/csaf-files at https://secvisogram.github.io

name: Secvisogram Website

# Runs on schedule, manually, or on repository_dispatch (csaf-publish) from secvisogram/csaf-files.
# Every run fetches the latest sources instead of using an event snapshot.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [ csaf-publish ]
  schedule:
    - cron: '37 6 * * *'

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

env:
  RUN_NEEDED: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether run is needed
        if: ${{ github.event_name == 'schedule' }}
        run: |
          cd "$RUNNER_TEMP"
          curl -sf https://raw.githubusercontent.com/secvisogram/secvisogram.github.io/gh-pages/COMMITHASH > app.current || : > app.current
          curl -sf https://raw.githubusercontent.com/secvisogram/secvisogram/gh-pages/COMMITHASH > app.source || : > app.source
          curl -sf https://raw.githubusercontent.com/secvisogram/secvisogram.github.io/gh-pages/PROVIDER_COMMITHASH > provider.current || : > provider.current
          git ls-remote https://github.com/secvisogram/csaf-files.git refs/heads/gh-pages | cut -f1 > provider.source
          if test -s provider.source && cmp -s app.current app.source && cmp -s provider.current provider.source; then
            echo "RUN_NEEDED=false" >> $GITHUB_ENV
          fi
      - name: Checkout current repo
        if: ${{ env.RUN_NEEDED == 'true' }}
        uses: actions/checkout@v4
      - name: Checkout built GitHub Pages from Secvisogram repo
        if: ${{ env.RUN_NEEDED == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: secvisogram/secvisogram
          ref: gh-pages
          path: build
      - name: Checkout latest CSAF trusted-provider output from csaf-files repo
        if: ${{ env.RUN_NEEDED == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: secvisogram/csaf-files
          ref: gh-pages
          path: provider
      - name: Remove .git directory to allow further process
        if: ${{ env.RUN_NEEDED == 'true' }}
        run: rm -rf build/.git
      # TODO(csaf-action#canonical_url_prefix): the script rewrites self-referencing URLs;
      # remove the rewrite once csaf-action supports canonical_url_prefix (see csaf-files README).
      - name: Merge CSAF trusted-provider output into the site
        if: ${{ env.RUN_NEEDED == 'true' }}
        run: |
          bash scripts/merge-provider-output.sh build provider
          git -C provider rev-parse HEAD > build/PROVIDER_COMMITHASH
      - name: Deploy to GitHub Pages
        if: ${{ env.RUN_NEEDED == 'true' }}
        uses: crazy-max/ghaction-github-pages@v4
        with:
          repo: secvisogram/secvisogram.github.io
          target_branch: gh-pages
          build_dir: build
          # .nojekyll so that Pages serves the .well-known dot-directory
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}